<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#062f25">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<title>KindleSociety Volunteer Portal</title>
<style>
:root{--deep:#062f25;--forest:#0a5c45;--mint:#4caf5f;--mist:#eaf4ec;--ink:#0b2a22;--soft:#3f5a50;--ember:#f26a1b;--amber:#f5a524;--serif:"Noto Serif","Noto Sans Bengali",Georgia,serif;--sans:Inter,"Noto Sans Bengali",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:var(--sans);background:var(--mist);color:var(--ink);line-height:1.6;overflow-x:hidden}
.dark{background:radial-gradient(ellipse at 70% 30%,#0c6b52,var(--deep) 85%);color:#fff;position:relative;overflow:hidden}
.fl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl i{position:absolute;display:grid;place-items:center;font-style:normal;border-radius:50%;background:rgba(255,255,255,.09);border:1.5px solid rgba(76,175,95,.4);animation:f 9s ease-in-out infinite}
.fl i:nth-child(1){width:76px;height:76px;font-size:30px;left:7%;top:20%}.fl i:nth-child(2){width:50px;height:50px;font-size:20px;right:12%;top:16%;animation-delay:-3s;background:rgba(242,106,27,.18);border-color:rgba(242,106,27,.4)}
.fl i:nth-child(3){width:62px;height:62px;font-size:26px;right:26%;bottom:10%;animation-delay:-6s}.fl i:nth-child(4){width:40px;height:40px;font-size:17px;left:30%;bottom:14%;animation-delay:-2s}
@keyframes f{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-20px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.fl i{animation:none}}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;letter-spacing:.24em;font-size:.95rem;position:relative}.brand img{width:48px;height:48px;border-radius:50%}.brand em{font-style:normal;color:var(--mint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:2px solid var(--mint);background:var(--mint);color:var(--deep);font:700 .92rem var(--sans);padding:10px 22px;border-radius:999px;cursor:pointer}
.btn:hover{background:#5cc06e}.btn.line{background:transparent;color:var(--forest);border-color:var(--forest)}.btn.sm{min-height:36px;padding:6px 14px;font-size:.82rem}.btn.red{background:#fff;border-color:#c0392b;color:#c0392b}.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
label{display:block;font-weight:600;font-size:.86rem;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #cfdcd3;border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(76,175,95,.4);border-color:var(--mint)}
.msg{padding:12px 14px;border-radius:10px;margin-top:14px;font-size:.9rem}.err{background:#fdecea;color:#8a1f12}.ok{background:#d6f0dc;color:var(--forest)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lc{position:relative;background:#fff;color:var(--ink);border-radius:20px;border-top:6px solid var(--mint);padding:34px 30px;width:min(440px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.lc h1{font-family:var(--serif);font-size:1.6rem;margin:6px 0 4px}.lc p.s{color:var(--soft);font-size:.92rem}
/* app */
.top{padding:18px clamp(18px,4vw,56px) 70px}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative}
.user{display:flex;align-items:center;gap:12px}.user b{display:block;font-size:.92rem;line-height:1.2}.user small{color:#b9d6c3;font-size:.78rem}
.av{width:42px;height:42px;border-radius:50%;background:var(--mint);color:var(--deep);display:grid;place-items:center;font-weight:700}
.hello{position:relative;margin-top:26px}.hello h1{font-family:var(--serif);font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.15}.hello p{color:#cfe5d6;margin-top:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 clamp(18px,4vw,56px);margin-top:-30px;position:relative;z-index:2;scrollbar-width:none}
.tab{flex:none;min-height:46px;border:0;background:#fff;color:var(--soft);font:600 .92rem var(--sans);padding:10px 20px;border-radius:14px;cursor:pointer;box-shadow:0 6px 18px rgba(6,47,37,.12)}
.tab.on{background:var(--forest);color:#fff}
main{padding:22px clamp(18px,4vw,56px) 80px;max-width:1280px;margin:0 auto}
.card{background:#fff;border-radius:16px;border-top:5px solid var(--mint);padding:22px;box-shadow:0 6px 24px rgba(6,47,37,.08);margin-bottom:18px}
.card h2{font-family:var(--serif);font-size:1.2rem;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#1f7a57,#3fb67f)}
.stat:nth-child(2){background:linear-gradient(135deg,#e08a0b,#f5a524)}.stat:nth-child(3){background:linear-gradient(135deg,#3a77cf,#4a8fe7)}.stat:nth-child(4){background:linear-gradient(135deg,#0a5c45,#4caf5f)}.stat:nth-child(5){background:linear-gradient(135deg,#c0392b,#ef6f5e)}
.stat b{display:block;font:700 2rem var(--serif);line-height:1.1}.stat span{font-size:.82rem;opacity:.92}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
.col{background:#dfeee3;border-radius:16px;padding:12px}.col h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--forest);margin:4px 6px 10px}
.t{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:5px solid var(--mint);box-shadow:0 2px 8px rgba(6,47,37,.06)}
.t.late{border-left-color:#c0392b}.t b{display:block;overflow-wrap:anywhere}.t p{font-size:.88rem;color:var(--soft);margin:4px 0;overflow-wrap:anywhere}
.m{font-size:.78rem;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:#d6f0dc;color:var(--forest)}.pill.late{background:#fdecea;color:#8a1f12}.pill.r{background:#e8eefc;color:#2a4a9a}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.empty{text-align:center;color:var(--soft);padding:26px 10px}
.bar2{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar2 select{width:auto;min-width:160px}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mint);margin-right:6px;animation:p 2s infinite}@keyframes p{70%{box-shadow:0 0 0 9px rgba(76,175,95,0)}0%{box-shadow:0 0 0 0 rgba(76,175,95,.7)}}
@media(max-width:860px){.kan{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="mobile.css"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<section id="login" class="dark"><div class="fl" aria-hidden="true"><i>🤝</i><i>✅</i><i>🌱</i><i>📋</i></div>
 <form class="lc" id="lf"><div class="brand" style="color:var(--deep)"><img src="logo.png" alt="KindleSociety logo"><span>KINDLE<em>SOCIETY</em></span></div>
 <h1>Volunteer Portal</h1><p class="s">Sign in with your volunteer account to see the tasks given to you.</p>
 <label for="em">Email</label><input id="em" type="email" required autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
 <button class="btn" style="margin-top:20px;width:100%">Sign in</button><div class="msg err" id="le" hidden></div></form></section>
<div id="app" hidden>
 <header class="dark top"><div class="fl" aria-hidden="true"><i>🤝</i><i>✅</i><i>🌱</i><i>📋</i></div>
  <div class="bar"><div class="brand"><img src="logo.png" alt="KindleSociety logo"><span>KINDLE<em>SOCIETY</em></span></div>
  <div class="user"><span class="av" id="av">K</span><div><b id="un"></b><small id="ur"></small></div><button class="btn sm ghost" id="out">Sign out</button></div></div>
  <div class="hello"><h1 id="hi"></h1><p><span class="live"></span>Live: updates automatically</p></div></header>
 <nav class="tabs" id="tabs"></nav><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
var K=window.KS,$=function(i){return document.getElementById(i)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var ready=K&&K.SUPABASE_URL&&K.SUPABASE_URL.indexOf('YOUR-')<0,db=ready?supabase.createClient(K.SUPABASE_URL,K.SUPABASE_ANON_KEY):null;
var ME=null,TASKS=[],PEOPLE=[],DEPTS=[],TAB='dash',RT=null,RTT=null,FILT={st:'',mine:false};
var ST=[['todo','To do'],['doing','In progress'],['done','Done']];
function lead(){return ME&&(ME.role==='head'||ME.role==='board')}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function late(t){return t.due_date&&t.status!=='done'&&t.due_date<today()}
function nm(id){if(!id)return 'Unassigned';if(id===ME.user_id)return 'Me';var p=PEOPLE.find(function(x){return x.user_id===id});return p?p.full_name:'Your head'}
function dn(id){var d=DEPTS.find(function(x){return x.id===id});return d?d.name:'-'}
function fd(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function toast(t,ok){var m=$('toast');if(!m){m=el('div','msg');m.id='toast';m.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)';document.body.append(m)}
 m.className='msg '+(ok?'ok':'err');m.textContent=t;m.hidden=false;clearTimeout(m._t);m._t=setTimeout(function(){m.hidden=true},3500)}
$('lf').addEventListener('submit',async function(e){e.preventDefault();var le=$('le');le.hidden=true;if(!ready){le.textContent='Not connected yet.';le.hidden=false;return}
 var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){le.textContent='Wrong email or password.';le.hidden=false;return}enter()});
$('out').onclick=async function(){await db.auth.signOut();leave()};
function leave(){if(RT){db.removeChannel(RT);RT=null}ME=null;$('app').hidden=true;$('login').hidden=false;$('pw').value=''}
async function enter(){var s=await db.auth.getSession();if(!s.data.session)return;var uid=s.data.session.user.id;
 var r=await db.from('profiles').select('*').eq('user_id',uid).maybeSingle(),le=$('le');
 if(r.error||!r.data||!r.data.active||r.data.role!=='volunteer'){await db.auth.signOut();le.textContent='This account is not a volunteer account.';le.hidden=false;return}
 ME=r.data;$('login').hidden=true;$('app').hidden=false;
 $('un').textContent=ME.full_name;$('av').textContent=ME.full_name.trim().charAt(0).toUpperCase();$('ur').textContent='Volunteer';
 $('hi').textContent='Welcome, '+ME.full_name.split(' ')[0];buildTabs();await load();live()}
function buildTabs(){var t=[['dash','Dashboard'],['tasks','Tasks']];if(lead())t.push(['assign','Assign task'],['people','People']);
 var n=$('tabs');n.replaceChildren();t.forEach(function(x){var b=el('button','tab'+(x[0]===TAB?' on':''),x[1]);b.onclick=function(){TAB=x[0];buildTabs();render()};n.append(b)})}
async function load(){var r=await Promise.all([db.from('tasks').select('*').order('created_at',{ascending:false}),db.from('profiles').select('user_id,full_name,role,dept_id,active'),db.from('departments').select('*').order('id')]);
 TASKS=r[0].data||[];PEOPLE=r[1].data||[];DEPTS=r[2].data||[];render()}
function live(){if(RT)return;var go=function(){clearTimeout(RTT);RTT=setTimeout(function(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){go();return}load()},1200)};
 RT=db.channel('vol-live').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},go).on('postgres_changes',{event:'*',schema:'public',table:'profiles'},go).subscribe()}
function render(){var m=$('main');m.replaceChildren();({dash:dash,tasks:tasks,assign:assign,people:people})[TAB](m)}
function count(l){return {all:l.length,todo:l.filter(function(t){return t.status==='todo'}).length,doing:l.filter(function(t){return t.status==='doing'}).length,done:l.filter(function(t){return t.status==='done'}).length,late:l.filter(late).length}}
function dash(m){var c=count(TASKS),s=el('div','stats');[['Total tasks',c.all],['To do',c.todo],['In progress',c.doing],['Done',c.done],['Overdue',c.late]].forEach(function(x){var d=el('div','stat');d.append(el('b','',x[1]),el('span','',x[0]));s.append(d)});m.append(s);
 var cd=el('div','card');cd.append(el('h2','',lead()?'Needs attention':'My next tasks'));
 var o=TASKS.filter(function(t){return t.status!=='done'&&(t.assigned_to===ME.user_id)}).sort(function(a,b){return (a.due_date||'9999').localeCompare(b.due_date||'9999')}).slice(0,6);
 if(!o.length)cd.append(el('div','empty',lead()?'Nothing is overdue. Great work!':'You have no open tasks right now.'));o.forEach(function(t){cd.append(card(t))});m.append(cd)}
function card(t){var d=el('div','t'+(late(t)?' late':''));d.append(el('b','',t.title));if(t.details)d.append(el('p','',t.details));
 var mt=el('div','m');mt.append(el('span','pill r',ST.find(function(x){return x[0]===t.status})[1]),el('span','','For: '+nm(t.assigned_to)));if(t.dept_id)mt.append(el('span','',dn(t.dept_id)));
 if(t.due_date){mt.append(el('span','','Due '+fd(t.due_date)));if(late(t))mt.append(el('span','pill late','Overdue'))}d.append(mt);
 var a=el('div','acts');ST.forEach(function(x){if(x[0]!==t.status){var b=el('button','btn sm line',x[0]==='done'?'Mark done':'Move to '+x[1]);b.onclick=function(){setSt(t,x[0])};a.append(b)}});
 if(lead()){var r=el('button','btn sm red','Delete');r.onclick=function(){delT(t)};a.append(r)}d.append(a);return d}
async function setSt(t,s){var r=await db.from('tasks').update({status:s}).eq('id',t.id);if(r.error)return toast('Could not update: '+r.error.message);t.status=s;toast('Saved',true);render()}
async function delT(t){if(!confirm('Delete this task?'))return;var r=await db.from('tasks').delete().eq('id',t.id);if(r.error)return toast('Could not delete: '+r.error.message);TASKS=TASKS.filter(function(x){return x.id!==t.id});render()}
function tasks(m){var b=el('div','bar2'),sf=el('select');[['','All statuses']].concat(ST).forEach(function(x){var o=el('option','',x[1]);o.value=x[0];sf.append(o)});sf.value=FILT.st;sf.onchange=function(){FILT.st=sf.value;render()};b.append(sf);
 if(lead()){var mb=el('button','btn sm '+(FILT.mine?'':'line'),'Only my tasks');mb.onclick=function(){FILT.mine=!FILT.mine;render()};b.append(mb)}m.append(b);
 var l=TASKS.filter(function(t){return (!FILT.st||t.status===FILT.st)&&(!FILT.mine||t.assigned_to===ME.user_id)});
 if(!l.length){m.append(el('div','card empty','No tasks to show.'));return}
 var k=el('div','kan');ST.forEach(function(s){if(FILT.st&&FILT.st!==s[0])return;var c=el('div','col');c.append(el('h3','',s[1]+' ('+l.filter(function(t){return t.status===s[0]}).length+')'));l.filter(function(t){return t.status===s[0]}).forEach(function(t){c.append(card(t))});k.append(c)});m.append(k)}
function assign(m){var c=el('div','card'),f=el('form');c.append(el('h2','','Assign a new task'));
 function fld(l,x){f.append(el('label','',l),x);return x}
 var ti=fld('Task title *',el('input'));ti.required=true;ti.maxLength=120;var de=fld('Details',el('textarea'));de.rows=3;de.maxLength=600;
 var dp=el('select');DEPTS.filter(function(d){return ME.role==='board'||d.id===ME.dept_id}).forEach(function(d){var o=el('option','',d.name);o.value=d.id;dp.append(o)});if(ME.role==='head'){dp.value=ME.dept_id;dp.disabled=true}
 var as=el('select');function fill(){as.replaceChildren();var o=el('option','','Anyone in the department (unassigned)');o.value='';as.append(o);PEOPLE.filter(function(p){return p.active&&p.role!=='board'&&p.dept_id===Number(dp.value)&&p.user_id!==ME.user_id}).forEach(function(p){var x=el('option','',p.full_name+' ('+p.role+')');x.value=p.user_id;as.append(x)})}
 var g=el('div','row2'),a=el('div'),b=el('div');a.append(el('label','','Department'),dp);b.append(el('label','','Assign to'),as);g.append(a,b);f.append(g);fill();dp.onchange=fill;
 var du=fld('Due date',el('input'));du.type='date';var bt=el('button','btn','Assign task');bt.style.marginTop='18px';f.append(bt);var er=el('div','msg err');er.hidden=true;f.append(er);
 f.onsubmit=async function(e){e.preventDefault();er.hidden=true;bt.disabled=true;var r=await db.from('tasks').insert({title:ti.value.trim(),details:de.value.trim()||null,dept_id:Number(dp.value),assigned_to:as.value||null,assigned_by:ME.user_id,due_date:du.value||null});bt.disabled=false;
  if(r.error){er.textContent='Could not assign: '+r.error.message;er.hidden=false;return}toast('Task assigned',true);f.reset();if(ME.role==='head')dp.value=ME.dept_id;fill();load()};
 c.append(f);m.append(c)}
function people(m){var g=el('div','people'),l=PEOPLE.filter(function(p){return p.user_id!==ME.user_id&&p.active});
 if(!l.length){m.append(el('div','card empty','No people to show yet.'));return}
 l.forEach(function(p){var c=el('div','card'),mine=TASKS.filter(function(t){return t.assigned_to===p.user_id}),n=count(mine);c.append(el('h2','',p.full_name));
  var mt=el('div','m');mt.append(el('span','pill',p.role),el('span','',dn(p.dept_id)));c.append(mt,el('p','',n.todo+n.doing+' open · '+n.done+' done'+(n.late?' · '+n.late+' overdue':'')));g.append(c)});m.append(g)}
(async function(){if(ready){var s=await db.auth.getSession();if(s.data.session)enter()}})();
</script></body></html>
