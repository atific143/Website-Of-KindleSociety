  return[fd(a.spent_on),progName(a.program_id)||a.event||'General',a.category||'',itemCell(a),a.quantity&&a.unit_price?a.quantity+' \u00D7 '+money(a.unit_price):'',money(a.amount),d?d.donor_id:'',canW()?btns(ed,x):'']});
