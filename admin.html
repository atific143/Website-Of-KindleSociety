<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css"><title>Finance panel | KindleSociety</title></head><body>
<div class="top"><div class="wrap wide"><div class="bar"><a class="brand" href="index.html"><img src="logo.png" alt="KindleSociety logo"><span>KINDLE<em>SOCIETY</em></span></a><a class="back" id="logout" href="#" hidden>Sign out</a></div>
<div class="hd"><h1>Finance panel</h1><p>Verify donations and record how they are spent. For the Finance team only.</p></div></div></div>
<main class="wrap wide">
<div id="setup" class="msg warn" hidden>This page is not connected yet. Fill in config.js (see SETUP.txt).</div>
<section class="card" id="login" style="max-width:460px"><h2>Sign in</h2><form id="lf"><label for="em">Email</label><input id="em" type="email" required autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"><button class="btn" type="submit">Sign in</button><div id="lerr" class="msg err" hidden></div></form></section>
<div id="panel" hidden>
<div class="sum" id="sum" style="grid-template-columns:repeat(4,1fr)"></div>
<div class="card"><label for="flt" style="margin-top:0">Show</label><select id="flt" style="max-width:220px"><option value="pending">Pending</option><option value="verified">Verified</option><option value="rejected">Rejected</option><option value="all">All</option></select><div id="gerr" class="msg err" hidden></div></div>
<div id="list"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
var K=window.KS,ready=K.SUPABASE_URL.indexOf('YOUR-')<0,$=function(id){return document.getElementById(id)};
var db=ready?supabase.createClient(K.SUPABASE_URL,K.SUPABASE_ANON_KEY):null;if(!ready)$('setup').hidden=false;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function money(n){return '\u09F3'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
function fd(d){return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function gerr(t){var e=$('gerr');e.textContent=t||'';e.hidden=!t}
var DON=[],ALLOC=[];
function show(on){$('login').hidden=on;$('panel').hidden=!on;$('logout').hidden=!on}
async function boot(){if(!ready)return;var s=await db.auth.getSession();if(s.data.session){show(true);load()}}
$('lf').addEventListener('submit',async function(e){e.preventDefault();var le=$('lerr');le.hidden=true;if(!ready){le.textContent='Not connected yet.';le.hidden=false;return}
 var r=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){le.textContent='Wrong email or password.';le.hidden=false;return}show(true);load()});
$('logout').addEventListener('click',async function(e){e.preventDefault();await db.auth.signOut();show(false)});
$('flt').addEventListener('change',draw);
async function load(){gerr('');var d=await db.from('donations').select('*').order('created_at',{ascending:false});
 var a=await db.from('allocations').select('*').order('spent_on');
 if(d.error||a.error){gerr('Could not load data. Check your connection.');return}
 DON=d.data;ALLOC=a.data;if(!DON.length)gerr('Nothing to show yet. If you expected donations, make sure your email is in the admins table (SETUP.txt step 4).');draw()}
function spentOf(id){return ALLOC.filter(function(a){return a.donation_id===id}).reduce(function(s,a){return s+Number(a.amount)},0)}
function draw(){
 var ver=DON.filter(function(d){return d.status==='verified'}),tot=ver.reduce(function(s,d){return s+Number(d.amount)},0),sp=ALLOC.reduce(function(s,a){return s+Number(a.amount)},0);
 var sum=$('sum');sum.replaceChildren();[['Verified total',money(tot)],['Spent',money(sp)],['Balance',money(tot-sp)],['Pending',DON.filter(function(d){return d.status==='pending'}).length]].forEach(function(p){var b=el('div');b.append(el('b','',p[1]),el('span','',p[0]));sum.append(b)});
 var f=$('flt').value,list=$('list');list.replaceChildren();
 DON.filter(function(d){return f==='all'||d.status===f}).forEach(function(d){list.append(card(d))})}
function card(d){var c=el('section','card'),h=el('h2','',d.donor_id+'  \u00B7  '+money(d.amount));c.append(h,el('span','badge b-'+d.status,d.status));
 c.append(el('p','meta',d.method+' \u00B7 TrxID: '+d.tx_id+' \u00B7 '+fd(d.created_at)));
 c.append(el('p','meta','Name: '+(d.donor_name||'Anonymous')+(d.contact?' \u00B7 Contact: '+d.contact:'')));
 if(d.note)c.append(el('p','meta','Message: '+d.note));if(d.admin_note)c.append(el('p','meta','Admin note: '+d.admin_note));
 var acts=el('div','acts');
 if(d.status==='pending'){
  var v=el('button','btn small','Verify');v.onclick=async function(){if(!confirm('Did you check TrxID '+d.tx_id+' for '+money(d.amount)+' in the bKash/Nagad statement?'))return;
   var r=await db.from('donations').update({status:'verified',verified_at:new Date().toISOString()}).eq('id',d.id);if(r.error)gerr('Could not verify.');else load()};
  var x=el('button','btn small red','Reject');x.onclick=async function(){var why=prompt('Reason (the donor will see this):');if(!why)return;
   var r=await db.from('donations').update({status:'rejected',admin_note:why}).eq('id',d.id);if(r.error)gerr('Could not reject.');else load()};
  acts.append(v,x)}
 if(d.status==='verified'){var left=Number(d.amount)-spentOf(d.id);c.append(el('p','meta','Not spent yet: '+money(left)));
  ALLOC.filter(function(a){return a.donation_id===d.id}).forEach(function(a){c.append(el('div','alloc',money(a.amount)+' \u2014 '+a.purpose+(a.event?' ('+a.event+')':'')+' \u00B7 '+fd(a.spent_on)+(a.details?' \u00B7 '+a.details:'')))});
  var t=el('button','btn small','Add spending');t.onclick=function(){t.hidden=true;acts.append(form(d,left))};acts.append(t)}
 c.append(acts);return c}
function field(lbl,type,max){var w=el('div');w.append(el('label','',lbl));var i=document.createElement(type==='area'?'textarea':'input');if(type!=='area')i.type=type;if(max)i.maxLength=max;w.append(i);w.i=i;return w}
function form(d,left){var f=el('form'),a=field('Amount spent (BDT) *','number'),p=field('What was it spent on? *','text',120),e=field('Event / program','text',120),dt=field('Date spent','date'),u=field('Proof link (https://, optional)','text',300),n=field('Details / notes for the donor','area',400);
 a.i.min=1;a.i.step='0.01';a.i.max=left;dt.i.valueAsDate=new Date();var row=el('div','row2');row.append(a,dt);f.append(row,p,e,u,n);
 var s=el('button','btn','Save');s.type='submit';var m=el('div','msg err');m.hidden=true;f.append(s,m);
 f.onsubmit=async function(ev){ev.preventDefault();m.hidden=true;var amt=Number(a.i.value),pr=p.i.value.trim(),pf=u.i.value.trim();
  if(!(amt>0)||amt>left+0.001||!pr){m.textContent='Enter a valid amount (not more than '+money(left)+') and what it was spent on.';m.hidden=false;return}
  if(pf&&pf.indexOf('https://')!==0){m.textContent='Proof link must start with https://';m.hidden=false;return}
  var r=await db.from('allocations').insert({donation_id:d.id,amount:amt,purpose:pr,event:e.i.value.trim()||null,details:n.i.value.trim()||null,proof_url:pf||null,spent_on:dt.i.value});
  if(r.error){m.textContent='Could not save.';m.hidden=false;return}load()};return f}
boot();
</script></body></html>
