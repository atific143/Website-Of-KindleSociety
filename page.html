<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KindleSociety</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .page-wrap { max-width: 820px; margin: -40px auto 60px; padding: 0 20px; position: relative; z-index: 5; }
  .article-card { background: #fff; border-radius: 22px; padding: clamp(24px, 5vw, 48px); box-shadow: 0 18px 40px -15px rgba(6,47,37,0.12); border: 1px solid #dbe7de; }
  .cover { width: 100%; max-height: 380px; object-fit: cover; border-radius: 14px; margin-bottom: 24px; }
  .body-text { font-size: 1.05rem; line-height: 1.8; color: #1b332b; white-space: pre-line; }
</style>
</head>
<body>
<div class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="index.html"><img src="logo.png" alt="Logo"><span>KINDLE<em>SOCIETY</em></span></a>
      <a class="back" href="index.html">&larr; Back to Home</a>
    </div>
    <div class="hd"><h1 id="pgTitle">Loading...</h1></div>
  </div>
</div>
<div class="page-wrap">
  <div class="article-card">
    <img id="pgCover" class="cover" hidden>
    <div id="pgBody" class="body-text"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(async function() {
  const slug = new URLSearchParams(location.search).get('p');
  if (!slug) { document.getElementById('pgTitle').textContent = 'Page Not Found'; return; }
  const db = supabase.createClient(window.KS.SUPABASE_URL, window.KS.SUPABASE_ANON_KEY);
  const { data } = await db.from('site_pages').select('*').eq('slug', slug).single();
  if (!data) { document.getElementById('pgTitle').textContent = 'Page Not Found'; return; }
  document.title = data.title + ' | KindleSociety';
  document.getElementById('pgTitle').textContent = data.title;
  document.getElementById('pgBody').innerHTML = data.content;
  if (data.cover_image) {
    const img = document.getElementById('pgCover');
    img.src = data.cover_image;
    img.hidden = false;
  }
})();
</script>
</body>
</html>
