<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans+Bengali:wght@500;700&display=swap" rel="stylesheet">
<title id="t">KindleSociety</title>
<style>
:root{--deep:#062f25;--forest:#0a5c45;--mint:#4caf5f;--mist:#eaf4ec;--ink:#0b2a22;--soft:#3f5a50;--serif:"Noto Serif","Noto Sans Bengali",Georgia,serif;--sans:Inter,"Noto Sans Bengali",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--sans);background:var(--mist);color:var(--ink);line-height:1.75;font-size:17px;overflow-x:hidden}
a{color:var(--forest)}.wrap{width:min(900px,100% - 40px);margin:0 auto}
.dark{background:radial-gradient(ellipse at 70% 30%,#0c6b52,var(--deep) 85%);color:#fff;position:relative;overflow:hidden}
.dark a{color:inherit}.bar{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;font-weight:700;letter-spacing:.24em;font-size:.95rem}.brand img{width:48px;height:48px;border-radius:50%}.brand em{font-style:normal;color:var(--mint)}
.back{text-decoration:none;color:#cfe5d6;font-size:.9rem;display:inline-flex;align-items:center;min-height:44px}
.hd{padding:34px 0 90px}.hd h1{font-family:var(--serif);font-size:clamp(2rem,6vw,3.4rem);line-height:1.15}
.arc{position:absolute;border:1.5px solid rgba(76,175,95,.22);border-radius:50%;pointer-events:none;width:560px;height:560px;right:-200px;top:-200px}
main{margin-top:-50px;padding-bottom:70px;position:relative}
.card{background:#fff;border-radius:18px;border-top:5px solid var(--mint);padding:clamp(22px,4vw,44px);box-shadow:0 10px 32px rgba(6,47,37,.1)}
.card img.cv{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin-bottom:24px}
.card p{margin-bottom:16px;color:#233f35;overflow-wrap:anywhere}.card h2{font-family:var(--serif);margin:26px 0 10px;font-size:1.4rem}
.card ul{margin:0 0 16px 22px}.msg{text-align:center;color:var(--soft);padding:30px 0}
footer{padding:34px 0;text-align:center}footer .strip{letter-spacing:.3em;font-size:.8rem;color:#b9d6c3;margin-top:10px}
</style><link rel="stylesheet" href="mobile.css"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"></head><body>
<header class="dark"><div class="arc"></div><div class="wrap"><div class="bar"><a class="brand" href="index.html"><img src="logo.png" alt="KindleSociety logo"><span>KINDLE<em>SOCIETY</em></span></a><a class="back" href="index.html">&larr; Back to home</a></div>
<div class="hd"><h1 id="h">&nbsp;</h1></div></div></header>
<main class="wrap"><article class="card" id="c"><p class="msg">Loading...</p></article></main>
<footer class="dark"><div class="wrap"><a class="brand" href="index.html" style="justify-content:center"><img src="logo.png" alt=""><span>KINDLE<em>SOCIETY</em></span></a><div class="strip">KINDLESOCIETY &bull; ESTABLISHED 2023</div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script><script src="config.js"></script>
<script>
var $=function(i){return document.getElementById(i)};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function body(t){var h='',inl=false;esc(t).split(/\n{2,}/).forEach(function(b){b=b.trim();if(!b)return;
 if(/^## /.test(b))h+='<h2>'+b.slice(3)+'</h2>';
 else if(/^(- .*(\n|$))+$/.test(b))h+='<ul>'+b.split('\n').map(function(l){return '<li>'+l.slice(2)+'</li>'}).join('')+'</ul>';
 else h+='<p>'+b.replace(/\n/g,'<br>')+'</p>'});return h}
async function go(){var slug=new URLSearchParams(location.search).get('p');
 if(!slug||!window.KS||KS.SUPABASE_URL.includes('YOUR-')){$('c').innerHTML='<p class="msg">Page not found.</p>';$('h').textContent='Not found';return}
 var db=supabase.createClient(KS.SUPABASE_URL,KS.SUPABASE_ANON_KEY),r=await db.from('site_pages').select('*').eq('slug',slug).maybeSingle();
 if(r.error||!r.data){$('c').innerHTML='<p class="msg">This page does not exist.</p>';$('h').textContent='Not found';return}
 var p=r.data;document.title=p.title+' | KindleSociety';$('h').textContent=p.title;
 $('c').innerHTML=(/^https:\/\//.test(p.cover_image||'')?'<img class="cv" alt="" src="'+esc(p.cover_image)+'">':'')+body(p.content||'')}
go();
</script></body></html>
